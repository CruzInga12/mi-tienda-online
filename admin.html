<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración - Tienda</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; vertical-align: middle; }
    th { background: #343a40; color: white; }
    input, select { padding: 8px; margin: 5px 0; width: 95%; display: block; }
    label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; color: #495057; }
    .btn { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    .btn-warning { background: #ffc107; color: #212529; margin-top: 0; margin-right: 5px; }
    .btn-danger { background: #dc3545; margin-top: 0; }
    .btn-back { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #007bff; font-weight: bold; }
    .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }

    /* Estilos del Modal de Edición */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; font-weight: bold; color: #aaa; }
    .close-modal:hover { color: #000; }
  </style>
</head>
<body>

<div class="container">
  <a href="/" class="btn-back">← Volver a la Tienda</a>
  <h1>Panel de Control (Backoffice)</h1>

  <!-- Formulario Nuevo Producto -->
  <div class="card">
    <h2>Agregar Nuevo Producto</h2>
    <form id="form-producto" enctype="multipart/form-data">
      <label for="nombre">Nombre del Producto:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto" required>

      <label for="precio">Precio (S/):</label>
      <input type="number" step="0.01" id="precio" name="precio" placeholder="Precio (S/)" required>

      <label for="stock">Stock Inicial:</label>
      <input type="number" id="stock" name="stock" placeholder="Stock inicial" required>

      <label for="categoria">Categoría:</label>
      <input type="text" id="categoria" name="categoria" placeholder="Ej. Ropa, Calzado, Accesorios">

      <label for="imagen">Imagen desde PC / Galería:</label>
      <input type="file" id="imagen" name="imagen" accept="image/*">

      <button type="submit" class="btn">Guardar Producto</button>
    </form>
  </div>

  <!-- Lista de Productos -->
  <div class="card">
    <h2>Gestión de Inventario</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Imagen</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-productos"></tbody>
    </table>
  </div>

  <!-- Registro Global de Ventas -->
  <div class="card">
    <h2>Ventas Realizadas</h2>
    <table>
      <thead>
        <tr>
          <th># Orden</th>
          <th>Cliente</th>
          <th>Monto</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tabla-ventas"></tbody>
    </table>
  </div>
</div>

<!-- MODAL DE EDICIÓN DE PRODUCTO -->
<div id="modal-editar" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="cerrarModal()">&times;</span>
    <h2>Editar Producto</h2>
    <form id="form-editar-producto" enctype="multipart/form-data">
      <input type="hidden" id="edit-id" name="id">

      <label for="edit-nombre">Nombre del Producto:</label>
      <input type="text" id="edit-nombre" name="nombre" required>

      <label for="edit-precio">Precio (S/):</label>
      <input type="number" step="0.01" id="edit-precio" name="precio" required>

      <label for="edit-stock">Stock:</label>
      <input type="number" id="edit-stock" name="stock" required>

      <label for="edit-categoria">Categoría:</label>
      <input type="text" id="edit-categoria" name="categoria">

      <label for="edit-imagen">Cambiar imagen (Opcional):</label>
      <input type="file" id="edit-imagen" name="imagen" accept="image/*">

      <button type="submit" class="btn" style="background: #007bff; width: 100%;">Actualizar Producto</button>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    cargarInventario();
    cargarVentas();

    // Crear Producto con FormData
    document.getElementById('form-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('nombre', document.getElementById('nombre').value);
      formData.append('precio', document.getElementById('precio').value);
      formData.append('stock', document.getElementById('stock').value);
      formData.append('categoria', document.getElementById('categoria').value);
      
      const archivo = document.getElementById('imagen').files[0];
      if (archivo) {
        formData.append('imagen', archivo);
      }

      const res = await fetch('/api/admin/productos', {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        e.target.reset();
        cargarInventario();
        alert('Producto guardado con éxito');
      } else {
        alert('Error al guardar el producto');
      }
    });

    // Guardar Edición de Producto con FormData
    document.getElementById('form-editar-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      
      const formData = new FormData();
      formData.append('nombre', document.getElementById('edit-nombre').value);
      formData.append('precio', document.getElementById('edit-precio').value);
      formData.append('stock', document.getElementById('edit-stock').value);
      formData.append('categoria', document.getElementById('edit-categoria').value);
      
      const archivoEdit = document.getElementById('edit-imagen').files[0];
      if (archivoEdit) {
        formData.append('imagen', archivoEdit);
      }

      const res = await fetch(`/api/admin/productos/${id}`, {
        method: 'PUT',
        body: formData
      });

      if (res.ok) {
        alert('Producto actualizado correctamente');
        cerrarModal();
        cargarInventario();
      } else {
        alert('Error al actualizar el producto');
      }
    });
  });

  async function cargarInventario() {
    const res = await fetch('/api/productos');
    const productos = await res.json();
    const tbody = document.getElementById('tabla-productos');
    tbody.innerHTML = '';

    productos.forEach(p => {
      tbody.innerHTML += `
        <tr>
          <td>${p.id}</td>
          <td><img src="${p.imagen}" class="img-preview" alt="Foto"></td>
          <td>${p.nombre}</td>
          <td>${p.categoria || 'General'}</td>
          <td>S/ ${Number(p.precio).toFixed(2)}</td>
          <td>${p.stock}</td>
          <td>
            <button class="btn btn-warning" onclick="abrirModalEditar(${p.id})">Editar</button>
            <button class="btn btn-danger" onclick="eliminarProducto(${p.id})">Eliminar</button>
          </td>
        </tr>
      `;
    });
  }

  async function abrirModalEditar(id) {
    const res = await fetch(`/api/admin/productos/${id}`);
    if (!res.ok) return alert('No se pudo cargar la información del producto');
    
    const p = await res.json();
    document.getElementById('edit-id').value = p.id;
    document.getElementById('edit-nombre').value = p.nombre;
    document.getElementById('edit-precio').value = p.precio;
    document.getElementById('edit-stock').value = p.stock;
    document.getElementById('edit-categoria').value = p.categoria || 'General';
    // Limpiamos el selector de archivo en el modal al abrirlo
    document.getElementById('edit-imagen').value = '';
    
    document.getElementById('modal-editar').style.display = 'flex';
  }

  function cerrarModal() {
    document.getElementById('modal-editar').style.display = 'none';
  }

  async function eliminarProducto(id) {
    if (confirm('¿Eliminar este producto?')) {
      await fetch(`/api/admin/productos/${id}`, { method: 'DELETE' });
      cargarInventario();
    }
  }

  async function cargarVentas() {
    const res = await fetch('/api/admin/pedidos');
    const ventas = await res.json();
    const tbody = document.getElementById('tabla-ventas');
    tbody.innerHTML = '';

    ventas.forEach(v => {
      tbody.innerHTML += `
        <tr>
          <td>#${v.id}</td>
          <td>${v.usuario_nombre || 'Invitado'} (${v.email || 'N/A'})</td>
          <td>S/ ${Number(v.monto).toFixed(2)}</td>
          <td>${new Date(v.fecha).toLocaleString()}</td>
        </tr>
      `;
    });
  }
</script>

</body>
</html>
